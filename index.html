<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VNPT Thành phố Hồ Chí Minh - Tuyển dụng</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:#f1f3f6;
  font-family:Arial,sans-serif;
}
.wrapper{
  width:min(100%,1241px);
  margin:0 auto;
  background:#fff;
}
.poster{
  position:relative;
  width:100%;
  line-height:0;
  overflow:hidden;
}
.poster img{
  display:block;
  width:100%;
  height:auto;
}
.hit{
  position:absolute;
  display:block;
  z-index:5;
  background:transparent;
  border-radius:12px;
}

/* Vùng tương tác trên poster */
.phone{left:7%;top:82%;width:42%;height:5%}
.map-hit{right:0;top:62%;width:48%;height:30%}
.apply{right:2%;bottom:2%;width:48%;height:17%}

/* Bản đồ HTML thật nằm dưới poster */
.map-section{
  background:#fff;
  padding:28px 28px 34px;
}
.map-title{
  margin:0 0 16px;
  display:inline-block;
  padding:10px 20px;
  border-radius:18px;
  background:linear-gradient(90deg,#063f75,#7044d9);
  color:#fff;
  font-size:24px;
  font-weight:900;
  line-height:1.15;
}
.map-box{
  position:relative;
  width:100%;
  height:430px;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 5px 22px rgba(0,0,0,.12);
  background:#e9edf2;
}
.map-box iframe{
  width:100%;
  height:100%;
  border:0;
}
.map-info{
  margin-top:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
  font-size:18px;
  font-weight:800;
  color:#173b68;
}
.map-info span{line-height:1.35}
.map-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:11px 17px;
  border-radius:12px;
  color:#fff;
  background:#1167c9;
  text-decoration:none;
  font-weight:900;
}
@media(max-width:700px){
  .map-section{padding:20px 14px 25px}
  .map-title{font-size:19px;padding:9px 14px}
  .map-box{height:330px;border-radius:16px}
  .map-info{font-size:15px}
  .map-button{font-size:14px}
}
</style>
</head>
<body>
<div class="wrapper">

  <section class="poster">
    <img src="poster.png" alt="Poster tuyển dụng VNPT">

    <!-- Gọi điện -->
    <a class="hit phone"
       href="tel:0919425345"
       aria-label="Gọi 0919 425 345"></a>

    <!-- Nhấn khu vực địa điểm để cuộn xuống bản đồ -->
    <a class="hit map-hit"
       href="#map"
       aria-label="Xem bản đồ VNPT Tân An Hội"></a>

    <!-- Nhấn khu vực liên hệ để gọi -->
    <a class="hit apply"
       href="tel:0919425345"
       aria-label="Liên hệ ứng tuyển"></a>
  </section>

  <section class="map-section" id="map">
    <h2 class="map-title">📍 ĐỊNH VỊ VNPT TÂN AN HỘI</h2>

    <div class="map-box">
      <iframe
        src="https://www.google.com/maps?q=174%20TL8%2C%20Khu%20ph%E1%BB%91%202%2C%20C%E1%BB%A7%20Chi%2C%20H%E1%BB%93%20Ch%C3%AD%20Minh%2C%20Vi%E1%BB%87t%20Nam&output=embed"
        loading="lazy"
        allowfullscreen
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>

    <div class="map-info">
      <span>📍 174 TL8, Khu phố 2, Củ Chi, Hồ Chí Minh, Việt Nam</span>
      <a class="map-button"
         href="https://www.google.com/maps/search/?api=1&query=174%20TL8%2C%20Khu%20ph%E1%BB%91%202%2C%20C%E1%BB%A7%20Chi%2C%20H%E1%BB%93%20Ch%C3%AD%20Minh%2C%20Vi%E1%BB%87t%20Nam"
         target="_blank" rel="noopener">🧭 Mở Google Maps</a>
    </div>
  </section>

</div>
</body>
</html>
