<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VNPT Thành phố Hồ Chí Minh - Tuyển dụng</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#e9edf2}body{display:flex;justify-content:center;min-height:100vh}.poster{position:relative;width:min(100vw,827px);line-height:0;background:#fff}.poster img{display:block;width:100%;height:auto}.hit{position:absolute;z-index:5;display:block;border-radius:12px;background:transparent}.phone{left:51%;top:88.8%;width:45%;height:3.7%}.map{left:65%;top:65.3%;width:33%;height:12.5%}.apply{left:52%;top:93.8%;width:44%;height:4.7%}.debug .hit{background:rgba(255,0,0,.12);outline:2px dashed red}</style>
</head>
<body>
<main class="poster" id="poster">
<img src="poster.png" alt="Poster tuyển dụng VNPT Thành phố Hồ Chí Minh">
<a class="hit phone" href="tel:0919425345" aria-label="Gọi 0919 425 345"></a>
<a class="hit map" href="https://www.google.com/maps/search/?api=1&query=174A%20T%E1%BB%89nh%20l%E1%BB%99%208%20X%C3%A3%20T%C3%A2n%20An%20H%E1%BB%99i%20TP%20H%E1%BB%93%20Ch%C3%AD%20Minh" target="_blank" rel="noopener" aria-label="Mở bản đồ địa điểm làm việc"></a>
<a class="hit apply" id="apply" href="#" aria-label="Ứng tuyển online"></a>
</main>
<script>
const APPLICATION_URL="";
const a=document.getElementById('apply');
if(APPLICATION_URL){a.href=APPLICATION_URL;a.target='_blank';a.rel='noopener'}else{a.onclick=e=>{e.preventDefault();alert('Chưa gắn link tuyển dụng online. Hãy điền APPLICATION_URL trong index.html.')}}
if(new URLSearchParams(location.search).get('debug')==='1')document.getElementById('poster').classList.add('debug');
</script>
</body>
</html>
